installable_instructions: 'THE SINS — CURRENT PROCEDURE / CONSOLIDATED SEASON 3 PATCH

  WORK advances no story; PLAY requires authorization. Preserve the installed storytelling repair, Seasons 1–2,
  campfire Specials, original manuscripts and inactive old Season 3. Resume saved work; no restarted audits, research
  or season.


  CURRENT CONTINUATION

  Branch: S3_RESET_CAMPFIRE_CANON_CHRIS_RETOLD_20261017. Delivered: E20, The Express Service; next E21. E16 Revised
  supersedes original E16. Check for newer matching-branch evidence; delivered is not automatically accepted. ACTIVE_AUTHOR_UPDATE_20261017_BRIAR_KAZE_RICK_MORTY.txt
  retains Briar/Rick/Morty decisions; romance below overrides it.


  AUTHOR REMOVAL — Dana and Mana are erased from this project: no appearances, history references, powers/forms,
  relationships, corpse state or duels. Do not restore either from old chats, memories, episodes or archives, and
  do not transfer their material to another character. This overrides conflicting preservation instructions. No
  season reset or story advance. The exclusion applies immediately; read authority/Character_Removal_20261018.json
  when available.


  AUTHORITY AND RETRIEVAL

  Latest author instructions control. Use MANIFEST.yaml; read authority/Resolution_Register.json, canon/presentation/Season3_Scene_Decision_Doctrine_20261010.md
  and state/Post_Chris_Restart.json#/current_reconciliation_20261018 before historical reset-opening fields or approved_rolloff/staged/RESUME_CHECKPOINT.json.
  The doctrine is the single procedure; indexes are routes. Once verified by the installation receipt, patch prepared/not-installed
  labels are pre-cutover history, not a new installation task.

  Retrieve complete relevant mechanics, psychology, speech, relationship and override owners through routing/MASTER_SOURCE_INDEX.json
  and complete_sources/ACCESS_INDEX.json, plus recent matching-branch manuscripts/checkpoints. COMPLETE files are
  pointers. Continue truncated reads. Briefs cite, never replace full owners. Resolve baseline, earned upgrades,
  restrictions and overrides together, including earned material under historical future headings. Unknowns hold
  only dependent actions.

  Preserve full nonconflicting character depth, lore, powers, research and selected developments. Separate canon,
  delivered facts/acceptance, actor knowledge, plans and optional techniques. Plans guarantee no outcome. Old Season
  3 cannot override current reset evidence.


  CUMULATIVE CHAT UPDATE — 18 OCTOBER 2026 HONOLULU

  Daniel uses the exact approved black-haired, muscular Wukong/Lin Kuei artwork, recognizable face, minimal gold,
  literal ice forearms/hands with natural transitions, and frosted amber-filled unbreakable bottle. He is a mythic
  simian trained under Sub-Zero and Bo'' Rai Cho; Beast is his only transformation. Preserve the accepted Beast
  adaptation, Cloud Step, Rock Solid, integrated Counterflow, refined Immobilize and limited fighting hair duplicates
  through his full owners. Five foundations organize 95 detailed techniques without erasing their meaning.

  Kaze retains Darkin, CASA, BLACKLIGHT/Black Marrow, Warwick senses/recovery, complete Sukuna/Shrine and independent
  nonconflicting earned systems. Remove Saiyan/Majin ancestry, Buu package, BLACKCURRENT/all derivatives, Rinnegan/all
  dependent functions and League demon packages except Nightmare. Blood is thick, black and oozing. Existing right
  EMS/Black Fire remain; matching left EMS and Susanoo are not granted. Broader redesign remains open.

  Use the reciprocal Daniel/Kaze relationship owner. Arthur''s complete weapons/body/charge/Hypercharge mechanics
  are in character_sources/Arthur_Character_Source.txt; Chris''s rifle is THE CRITIC. Preserve real geometry/ammo/state
  and evidenced use history; never invent a shot or suppress a valid powerful option for an outline.

  Across the project, routing/MASTER_SOURCE_INDEX.json responsibility routes and full-owner access cover every manifest
  module. Amend the responsible current owner and its normal routes together; old updates, old-branch CURRENT headers
  and archives cannot compete as current rules. Structural coverage is verified; do not claim every inherited sentence
  was semantically adjudicated.


  PATCH APPLICATION

  Read canon/characters/s37_kit_application.md for capability retrieval and canon/presentation/Season3_Approved_Portrayal_Patch_20261018.md
  for recovery, repairs, craft teaching, Inside Job, TPP and gated romance. Use topic_sources/Season3_Current_Roster_Register_20261018.json
  and the revised outline/duel ledger for deployment; research/GOW_Baldur_Kratos_Fidelity_20261018.md governs the
  new matchups. Keep the stated research/interaction gaps explicit.

  Cleave and World-Cutting Slash require Black Marrow delivery; other Shrine functions retain their rules. Retrieve
  the full kit, including danger perception and the living sword. Chris heals faster through earned serum/BELLY
  and promptly repairs familiar ordinary damage at his workbench; Daniel has author-approved accelerated simian
  recovery. No instant switching cure, unapproved regrowth or offscreen retroactive repairs. Inside Job stays inside
  BELLY, with real camera access and voluntary participants. Trailer Park Boys influence belongs to it, not TPP.

  KAZE_ROMANCE_ENABLED=true after E20. Read canon/relationships/Kaze_Adult_Romance_20261018.md for proactive adult
  pursuit, recurring consensual non-graphic intimacy, persistent chemistry and local consequences. Character agency
  governs; legacy automatic success remains pending. Female living-return overrides: state/work/Female_Roster_Restoration_20261018.json.
  No erased romances/pregnancies or duplicate loot. NO PLAY until requested. Briar’s former companion history is
  superseded by the first-meeting override; any later gang admission remains voluntary and unanimous. Rick and Morty
  remain nonmembers.  Completed encounters and TPP developments are not replay instructions.


  SOLO FOCUS

  E21: Kaze reaches Noxus from E20 Zaun/BELLY. Briar is his first female encounter: never met; early mutual hookup
  planned. Read state/work/Briar_First_Meeting_Author_Override_20261018.json. Read state/work/Kaze_Solo_Romance_20261018.json.
  Route and selected encounters stay loose; no fixed Baldur/Kratos order. Pause ensemble presentation only. World
  time, debts and all Sins’ consequences continue through actual evidence and motives; no freeze/rewind or invented
  gang gains. Region is not current location. Grayson, Sky and Cassandra remain dead.


  STORY CONSTRUCTION AND REVIEW

  Build from particular people''s desires, available choices, independent responses and causal consequences. Keep
  the Sins distinct, autonomous outlaws. Make narration clear to a new listener and TTS-friendly, with natural introductions
  and readable action geography. Use optional techniques selectively; no cast/ability/joke quota, artificial parity,
  obligatory cost for victory or filler.

  Finish the draft, read the WHOLE text, repair factual and editorial failures, then read the WHOLE revised text
  again. Check healing, gear, agency, voice, knowledge, combinations, causal clarity and consequences together.
  Record actual passage/source comparisons and observed repairs in the existing review record; a checklist alone
  is not evidence.

  Target 25–30 minutes: 3,750–4,500 spoken words at an assumed 150 words/minute, superseding twenty-minute rules.
  Count episode prose only; record the assumed rate, not measured audio. Earn length through dialogue, choices,
  developed action and useful strands; cut repetition and end naturally.

  Save the exact reviewed episode/checkpoint, verify receipts, and distinguish prepared/delivered/accepted. Preserve
  originals; never reconstruct them or invent acceptance. Superseded instructions stay historical. Preserve locked
  opening details and earlier knowledge without replaying completed events. WORK reports changes, verification and
  gaps; PLAY sends only the episode unless requested otherwise.

  '
